
trigger:
  branches:
    include:
      - main

stages:

# ==========================================
# STAGE 1: BUILD REACT APPLICATION
# ==========================================
- stage: Build
  displayName: Build React UI

  jobs:
  - job: BuildUI
    displayName: Build and Publish UI

    pool:
      name: Default
      demands:
        - Agent.Name -equals RadiantHRAI-Dev-IIS-Agent

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Install Node.js 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install Dependencies

    - script: npm run build
      displayName: Build React Application
      env:
        VITE_API_BASE_URL_LOGIN: 'http://192.168.3.2:8183/api/'
        VITE_API_BASE_URL_MODULES: 'http://192.168.3.2:8185/api'
        VITE_API_BASE_URL_ONBOARDING: 'http://192.168.3.2:8187/api'
        VITE_API_BASE_URL: 'http://192.168.3.2:8189/api'
        VITE_API_BASE_URL_MENU: 'http://192.168.3.2:8190/api'
        VITE_CLIENT_ID: 'AI'

    - task: PublishPipelineArtifact@1
      displayName: Publish React dist
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: 'ui-drop'
        publishLocation: 'pipeline'


# ==========================================
# STAGE 2: DEPLOY TO IIS
# ==========================================
- stage: Deploy
  displayName: Deploy React UI to IIS
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployUI
    displayName: Deploy UI to IIS Server

    environment: RadiantHRAI-Dev-UI

    pool:
      name: Default
      demands:
        - Agent.Name -equals RadiantHRAI-Dev-IIS-Agent

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: ui-drop

          - task: PowerShell@2
            displayName: Deploy React UI to IIS
            inputs:
              targetType: inline
              script: |
                Import-Module WebAdministration
                $ErrorActionPreference = "Stop"

                $siteName = "RadiantHRAI-Dev-UI"
                $appPool = "RadiantHRAI-Dev-UI"

                $source = "$(Pipeline.Workspace)\ui-drop"
                $destination = "C:\inetpub\wwwroot\RadiantHRAI-Dev\UI"

                # Validate build
                if (!(Test-Path "$source\index.html")) {
                    throw "React index.html not found!"
                }

                if (!(Test-Path "$source\web.config")) {
                    throw "web.config not found!"
                }

                # Validate destination
                if (!(Test-Path $destination)) {
                    New-Item -ItemType Directory -Path $destination -Force | Out-Null
                }

                # Deploy without stopping IIS
                Write-Host "Copying React files to IIS..."

                & robocopy $source $destination /MIR /R:3 /W:5
                $copyResult = $LASTEXITCODE

                if ($copyResult -ge 8) {
                    throw "Robocopy failed with exit code: $copyResult"
                }

                Write-Host "React files copied successfully."

                # Check application pool
                $poolState = (Get-WebAppPoolState -Name $appPool).Value
                Write-Host "Application Pool State: $poolState"

                if ($poolState -eq "Stopped") {
                    Write-Host "Starting application pool..."
                    Start-WebAppPool -Name $appPool
                }

                # Check website
                $siteState = (Get-Website -Name $siteName).State
                Write-Host "Website State: $siteState"

                if ($siteState -ne "Started") {
                    Write-Host "Starting IIS website..."
                    Start-WebSite -Name $siteName
                }

                Write-Host "Deployment completed successfully."
                exit 0
