
trigger:
  branches:
    include:
      - main

stages:

# ==========================================
# STAGE 1: BUILD REACT APPLICATION
# ==========================================
- stage: Build
  displayName: Build React UI

  jobs:
  - job: BuildUI
    displayName: Build and Publish UI

    pool:
      name: Default
      demands:
        - Agent.Name -equals RadiantHRAI-Dev-IIS-Agent

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Install Node.js 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install Dependencies

    - script: npm run build
      displayName: Build React Application

    - task: PublishPipelineArtifact@1
      displayName: Publish React dist
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: 'ui-drop'
        publishLocation: 'pipeline'


# ==========================================
# STAGE 2: DEPLOY TO IIS
# ==========================================
- stage: Deploy
  displayName: Deploy React UI to IIS
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployUI
    displayName: Deploy UI to IIS Server

    environment: RadiantHRAI-Dev-UI

    pool:
      name: Default
      demands:
        - Agent.Name -equals RadiantHRAI-Dev-IIS-Agent

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: ui-drop

          - task: PowerShell@2
            displayName: Deploy React UI to IIS
            inputs:
              targetType: inline
              script: |
                Import-Module WebAdministration
                $ErrorActionPreference = "Stop"

                $siteName = "RadiantHRAI-Dev-UI"
                $appPool = "RadiantHRAI-Dev-UI"

                $source = "$(Pipeline.Workspace)\ui-drop"
                $destination = "C:\inetpub\wwwroot\RadiantHRAI-Dev\UI"

                $timeout = 60

                # Validate build
                if (!(Test-Path "$source\index.html")) {
                    throw "React index.html not found!"
                }

                if (!(Test-Path "$source\web.config")) {
                    throw "web.config not found!"
                }

                # Stop website only if running
                $siteState = (Get-Website -Name $siteName).State

                if ($siteState -eq "Started") {
                    Write-Host "Stopping website..."
                    Stop-WebSite -Name $siteName
                }

                # Stop pool only if running
                $poolState = (Get-WebAppPoolState -Name $appPool).Value

                if ($poolState -ne "Stopped") {
                    Write-Host "Stopping application pool..."
                    Stop-WebAppPool -Name $appPool
                }

                # Wait until pool stops
                $elapsed = 0

                do {
                    Start-Sleep -Seconds 2
                    $elapsed += 2
                    $poolState = (Get-WebAppPoolState -Name $appPool).Value
                    Write-Host "Pool state: $poolState"

                } while ($poolState -ne "Stopped" -and $elapsed -lt $timeout)

                if ($poolState -ne "Stopped") {
                    throw "Application pool did not stop."
                }

                # Deploy
                Write-Host "Copying React files..."

                robocopy $source $destination /MIR
                $copyResult = $LASTEXITCODE

                if ($copyResult -gt 7) {
                    throw "Robocopy failed: $copyResult"
                }

                Write-Host "React files copied successfully."

                # Start pool
                $poolState = (Get-WebAppPoolState -Name $appPool).Value

                if ($poolState -ne "Started") {
                    Write-Host "Starting application pool..."
                    Start-WebAppPool -Name $appPool
                }

                # Wait until pool starts
                $elapsed = 0

                do {
                    Start-Sleep -Seconds 2
                    $elapsed += 2
                    $poolState = (Get-WebAppPoolState -Name $appPool).Value
                    Write-Host "Pool state: $poolState"

                } while ($poolState -ne "Started" -and $elapsed -lt $timeout)

                if ($poolState -ne "Started") {
                    throw "Application pool failed to start."
                }

                # Start website
                $siteState = (Get-Website -Name $siteName).State

                if ($siteState -ne "Started") {
                    Start-WebSite -Name $siteName
                }

                Write-Host "Deployment completed successfully."
                exit 0